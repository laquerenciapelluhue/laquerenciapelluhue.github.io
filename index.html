<style>
/* Layout: one narrow reading column; logo + wordmark, then a sticky row of category chips, then the dishes as price lists. */
:root {
  --bg: #f4f6fb;          /* agua clara */
  --surface: #ffffff;
  --ink: #1d1f5c;          /* azul del logo */
  --brand: #35399a;
  --muted: #5d6189;
  --line: #d9deec;
  --accent: #f0ac2e;       /* limón / yema */
  --chip-bg: #e8ebf6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10122e; --surface: #171a3f; --ink: #eef0fb; --brand: #b3b8ff;
    --muted: #a3a8cf; --line: #2b2f5e; --accent: #f5c160; --chip-bg: #1f2350;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10122e; --surface: #171a3f; --ink: #eef0fb; --brand: #b3b8ff;
  --muted: #a3a8cf; --line: #2b2f5e; --accent: #f5c160; --chip-bg: #1f2350;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Encabezado */
header.top { padding-block: 28px 18px; }
.brand { display: flex; align-items: center; gap: 16px; }
.logo {
  width: 92px; height: auto; flex: none;
  background: #ffffff; border-radius: 18px; padding: 8px 10px;
  box-shadow: 0 0 0 1px var(--line);
}
.brand-text { min-width: 0; }
.eyebrow {
  font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 2px;
}
h1 {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(28px, 8vw, 42px); line-height: 1; letter-spacing: -.02em;
  margin: 0; text-wrap: balance;
}
h1 .slash { color: var(--accent); font-weight: 700; padding: 0 .08em; }
h1 .q { display: inline-block; }
.wave { display: block; width: 100%; height: 14px; margin-top: 18px; color: var(--brand); opacity: .55; }

/* Búsqueda */
.search { position: relative; margin-top: 16px; }
.search input {
  width: 100%; font: inherit; font-size: 16px;
  padding: 12px 14px 12px 42px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* Navegación por categorías */
nav.cats {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px;
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: inherit; font-size: 14px; font-weight: 600;
  padding: 7px 14px; border-radius: 999px; border: 0;
  background: var(--chip-bg); color: var(--ink); cursor: pointer;
  text-decoration: none; white-space: nowrap;
}
.chip[aria-current="true"] { background: var(--ink); color: var(--bg); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Secciones */
main { padding-block: 8px 40px; }
section.cat { padding-top: 26px; scroll-margin-top: 64px; }
.cat h2 {
  font-family: var(--font-display); font-weight: 700;
  font-size: 24px; letter-spacing: -.01em; margin: 0;
  display: flex; align-items: center; gap: 10px;
}
.cat h2::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
.note { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-style: italic; }
.items { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
.item { padding-block: 12px; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.row { display: flex; align-items: baseline; gap: 12px; }
.name { font-weight: 600; font-size: 16.5px; min-width: 0; flex: 1; }
.price {
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
  color: var(--brand); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.desc { margin: 3px 0 0; color: var(--muted); font-size: 14.5px; max-width: 52ch; }

.empty { padding-block: 40px; text-align: center; color: var(--muted); }

footer { border-top: 1px solid var(--line); padding-block: 22px 32px; color: var(--muted); font-size: 13.5px; }
footer p { margin: 0 0 4px; }
</style>

<script>
/* ============================================================
   CONFIGURACIÓN
   Pega aquí el enlace CSV de la planilla de Google publicada
   (Archivo > Compartir > Publicar en la web > CSV).
   Si queda vacío, se muestra la carta de respaldo de este archivo.
   ============================================================ */
const PLANILLA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOiCCGQya61YUi0DfK_F4qxYQYA30pVpfI8kXzuCfvTwNFLs3mLEtGMzHrT05hZUoLFEGSKk_h_Sog/pub?gid=0&single=true&output=csv";

(function () {
  const $main = document.getElementById("carta");
  const $chips = document.getElementById("chips");
  const $q = document.getElementById("q");
  let categorias = [];

  function parseCSV(text) {
    const rows = []; let row = []; let field = ""; let quoted = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ""));
  }

  const norm = s => (s || "").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "");

  function construir(text) {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("Planilla vacía");
    const head = rows[0].map(norm);
    const col = n => head.indexOf(n);
    const iC = col("categoria"), iP = col("plato"), iD = col("descripcion"),
          iPr = col("precio"), iDi = col("disponible");
    if (iC < 0 || iP < 0) throw new Error("Faltan columnas");
    const mapa = new Map();
    for (const r of rows.slice(1)) {
      const cat = (r[iC] || "").trim(); if (!cat) continue;
      const disp = iDi < 0 ? "si" : norm(r[iDi]);
      if (disp === "no") continue;
      if (!mapa.has(cat)) mapa.set(cat, { nombre: cat, notas: [], items: [] });
      const g = mapa.get(cat);
      const plato = (r[iP] || "").trim();
      const desc = iD < 0 ? "" : (r[iD] || "").trim();
      if (!plato) { if (desc) g.notas.push(desc); continue; }
      g.items.push({ plato, desc, precio: iPr < 0 ? "" : (r[iPr] || "").trim() });
    }
    return [...mapa.values()].filter(g => g.items.length);
  }

  function precio(p) {
    if (!p) return "";
    const plus = p.trim().startsWith("+");
    const n = Number(p.replace(/[^\d]/g, ""));
    if (!n) return p;
    return (plus ? "+ " : "") + "$" + n.toLocaleString("es-CL");
  }

  const slug = s => "c-" + norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function esc(s) {
    return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function render(filtro) {
    const f = norm(filtro);
    const visibles = categorias.map(g => ({
      ...g,
      items: f ? g.items.filter(it => norm(it.plato + " " + it.desc + " " + g.nombre).includes(f)) : g.items
    })).filter(g => g.items.length);

    if (!visibles.length) {
      $main.innerHTML = '<p class="empty">No encontramos nada con “' + esc(filtro) + '”. Prueba con otra palabra.</p>';
      $chips.innerHTML = ""; return;
    }
    $main.innerHTML = visibles.map(g => `
      <section class="cat" id="${slug(g.nombre)}" aria-labelledby="${slug(g.nombre)}-t">
        <h2 id="${slug(g.nombre)}-t">${esc(g.nombre)}</h2>
        ${g.notas.map(n => `<p class="note">${esc(n)}</p>`).join("")}
        <ul class="items">
          ${g.items.map(it => `
            <li class="item">
              <div class="row"><span class="name">${esc(it.plato)}</span><span class="price">${esc(precio(it.precio))}</span></div>
              ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
            </li>`).join("")}
        </ul>
      </section>`).join("");
    $chips.innerHTML = visibles.map(g =>
      `<a class="chip" href="#${slug(g.nombre)}" data-id="${slug(g.nombre)}">${esc(g.nombre)}</a>`).join("");
    observar();
  }

  let obs;
  function marcar(id) {
    $chips.querySelectorAll(".chip").forEach(ch => {
      const on = ch.dataset.id === id;
      ch.setAttribute("aria-current", on ? "true" : "false");
      if (on) {
        const left = ch.offsetLeft - ($chips.clientWidth - ch.offsetWidth) / 2;
        $chips.scrollTo({ left, behavior: "smooth" });
      }
    });
  }
  function observar() {
    if (obs) obs.disconnect();
    if (!("IntersectionObserver" in window)) return;
    obs = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) marcar(vis[0].target.id);
    }, { rootMargin: "-70px 0px -65% 0px" });
    $main.querySelectorAll("section.cat").forEach(s => obs.observe(s));
    const first = $main.querySelector("section.cat"); if (first) marcar(first.id);
  }

  $chips.addEventListener("click", e => {
    const a = e.target.closest(".chip"); if (!a) return;
    e.preventDefault();
    const el = document.getElementById(a.dataset.id);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    marcar(a.dataset.id);
  });

  let t;
  $q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => render($q.value), 120); });

  function usarRespaldo() {
    categorias = construir(document.getElementById("carta-respaldo").textContent.trim());
    render($q.value);
  }

  usarRespaldo();
  if (PLANILLA_CSV_URL) {
    const url = PLANILLA_CSV_URL + (PLANILLA_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
    fetch(url, { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(txt => { const c = construir(txt); if (c.length) { categorias = c; render($q.value); } })
      .catch(() => { /* se mantiene la carta de respaldo */ });
  }
})();
</script>
