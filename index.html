/* Layout: a carved wooden header band holding the sign and contact buttons; below, a linen "menu card" column with small-caps sections and dotted price leaders. */
:root {
  --bg: #f3ece0;        /* lino */
  --surface: #fbf7ef;
  --ink: #2b1d15;       /* nogal */
  --muted: #6f5b4c;
  --line: #d8c8b0;
  --accent: #6a3d22;    /* nogal claro: títulos */
  --brass: #9a7535;     /* bronce: adornos */
  --chip-on: #2f1d14;   /* madera: categoría activa */
  --chip-on-ink: #f4e9d6;
  --chip-bg: #e7dccb;
  /* Banda de madera: igual en ambos temas */
  --wood-hi: #5a3826;
  --wood-lo: #2f1d14;
  --on-wood: #f4e9d6;
  --on-wood-muted: #d6c3a6;
  --font-display: "Alegreya SC", "Iowan Old Style", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1410; --surface: #251b16; --ink: #f1e6d4; --muted: #bba791;
    --line: #3d2e25; --accent: #d9b574; --brass: #c9a35e; --chip-bg: #2e231c; --chip-on: #d9b574; --chip-on-ink: #1b1410;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1410; --surface: #251b16; --ink: #f1e6d4; --muted: #bba791;
  --line: #3d2e25; --accent: #d9b574; --brass: #c9a35e; --chip-bg: #2e231c; --chip-on: #d9b574; --chip-on-ink: #1b1410;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wood-lo);
}
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header.top .wrap { padding-block: 26px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

}

.lugar {
  margin: -4px 0 0; font-family: var(--font-display); font-weight: 500;

}
.contacto { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 999px;
  border: 1px solid rgba(244,233,214,.35);
  background: rgba(0,0,0,.22); color: var(--on-wood);
  text-decoration: none; font-weight: 500; font-size: 15px;
}
.btn:hover { background: rgba(0,0,0,.36); border-color: rgba(244,233,214,.6); }
.btn:focus-visible { outline: 2px solid var(--on-wood); outline-offset: 2px; }
.btn svg { flex: none; }

/* Búsqueda */
.buscar { padding-block: 18px 6px; }
.search { position: relative; display: block; }
.search input {
  width: 100%; font: inherit; font-size: 16px;
  padding: 11px 14px 11px 42px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* Categorías */
nav.cats {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;

}
.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding-block: 10px; max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em;

}

<script>
/* ============================================================
   CONFIGURACIÓN
   PLANILLA_ID: el código de la planilla, que está en su enlace normal
   (docs.google.com/spreadsheets/d/ESTE_CODIGO/edit). Con él, la página
   lee la planilla al instante. La planilla debe estar compartida como
   "Cualquier persona con el enlace: Lector".
   PLANILLA_CSV_URL: enlace de "Publicar en la web" en CSV. Se usa como
   respaldo si el anterior falla.
   ============================================================ */
const PLANILLA_ID = "1mbHR5VFyDZ21Bn5ZXHfGw4muB7hXRM84uvCYaVrWthg";
const PLANILLA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOiCCGQya61YUi0DfK_F4qxYQYA30pVpfI8kXzuCfvTwNFLs3mLEtGMzHrT05hZUoLFEGSKk_h_Sog/pub?gid=0&single=true&output=csv";

(function () {
  const $main = document.getElementById("carta");
  const $chips = document.getElementById("chips");
  const $q = document.getElementById("q");
  let categorias = [];

  function parseCSV(text) {
    const rows = []; let row = []; let field = ""; let quoted = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ""));
  }

  const norm = s => (s || "").toString().trim().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "");

  function construir(input) {
    const rows = typeof input === "string" ? parseCSV(input) : input;
    if (rows.length < 2) throw new Error("Planilla vacía");
    const head = rows[0].map(norm);
    const col = n => head.indexOf(n);
    const iC = col("categoria"), iP = col("plato"), iD = col("descripcion"),
          iPr = col("precio"), iDi = col("disponible");
    if (iC < 0 || iP < 0) throw new Error("Faltan columnas");
    const mapa = new Map();
    for (const r of rows.slice(1)) {
      const cat = (r[iC] || "").trim(); if (!cat) continue;
      const disp = iDi < 0 ? "si" : norm(r[iDi]);
      if (disp === "no") continue;
      if (!mapa.has(cat)) mapa.set(cat, { nombre: cat, notas: [], items: [] });
      const g = mapa.get(cat);
      const plato = (r[iP] || "").trim();
      const desc = iD < 0 ? "" : (r[iD] || "").trim();
      if (!plato) { if (desc) g.notas.push(desc); continue; }
      g.items.push({ plato, desc, precio: iPr < 0 ? "" : (r[iPr] || "").trim() });
    }
    return [...mapa.values()].filter(g => g.items.length);
  }

  function precio(p) {
    if (!p) return "";
    const plus = p.trim().startsWith("+");
    const n = Number(p.replace(/[^\d]/g, ""));
    if (!n) return p;
    return (plus ? "+ " : "") + "$" + n.toLocaleString("es-CL");
  }

  const slug = s => "c-" + norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function esc(s) {
    return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function render(filtro) {
    const f = norm(filtro);
    const visibles = categorias.map(g => ({
      ...g,
      items: f ? g.items.filter(it => norm(it.plato + " " + it.desc + " " + g.nombre).includes(f)) : g.items
    })).filter(g => g.items.length);

    if (!visibles.length) {
      $main.innerHTML = '<p class="empty">No encontramos nada con “' + esc(filtro) + '”. Prueba con otra palabra.</p>';
      $chips.innerHTML = ""; return;
    }
    $main.innerHTML = visibles.map(g => `
      <section class="cat" id="${slug(g.nombre)}" aria-labelledby="${slug(g.nombre)}-t">
        <h2 id="${slug(g.nombre)}-t">${esc(g.nombre)}</h2>
        <svg class="orn" viewBox="0 0 150 14" aria-hidden="true"><path d="M2 7h50M98 7h50" stroke="currentColor" stroke-width="1"/><path d="M56 7c6-7 13-7 19 0c6 7 13 7 19 0M56 7c6 7 13 7 19 0c6-7 13-7 19 0" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="75" cy="7" r="2" fill="currentColor"/></svg>
        ${g.notas.map(n => `<p class="note">${esc(n)}</p>`).join("")}
        <ul class="items">
          ${g.items.map(it => `
            <li class="item">
              <div class="row"><span class="name">${esc(it.plato)}</span>${it.precio ? '<span class="dots" aria-hidden="true"></span>' : ""}<span class="price">${esc(precio(it.precio))}</span></div>
              ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
            </li>`).join("")}
        </ul>
      </section>`).join("");
    $chips.innerHTML = visibles.map(g =>
      `<a class="chip" href="#${slug(g.nombre)}" data-id="${slug(g.nombre)}">${esc(g.nombre)}</a>`).join("");
    observar();
  }

  let obs;
  function marcar(id) {
    $chips.querySelectorAll(".chip").forEach(ch => {
      const on = ch.dataset.id === id;
      ch.setAttribute("aria-current", on ? "true" : "false");
      if (on) {
        const left = ch.offsetLeft - ($chips.clientWidth - ch.offsetWidth) / 2;
        $chips.scrollTo({ left, behavior: "smooth" });
      }
    });
  }
  function observar() {
    if (obs) obs.disconnect();
    if (!("IntersectionObserver" in window)) return;
    obs = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) marcar(vis[0].target.id);
    }, { rootMargin: "-70px 0px -65% 0px" });
    $main.querySelectorAll("section.cat").forEach(s => obs.observe(s));
    const first = $main.querySelector("section.cat"); if (first) marcar(first.id);
  }

  $chips.addEventListener("click", e => {
    const a = e.target.closest(".chip"); if (!a) return;
    e.preventDefault();
    const el = document.getElementById(a.dataset.id);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    marcar(a.dataset.id);
  });

  let t;
  $q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => render($q.value), 120); });

  const CLAVE_LOCAL = "carta-ultima-version";
  const respaldo = () => document.getElementById("carta-respaldo").textContent.trim();
  function leerLocal() { try { return localStorage.getItem(CLAVE_LOCAL); } catch (e) { return null; } }
  function guardarLocal(txt) { try { localStorage.setItem(CLAVE_LOCAL, txt); } catch (e) {} }

  function aCSV(rows) {
    return rows.map(r => r.map(v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v).join(",")).join("\n");
  }

  function pedir(url, ms) {
    const ctrl = "AbortController" in window ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), ms) : null;
    const u = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
    return fetch(u, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(txt => { if (/^\s*</.test(txt)) throw new Error("No es CSV"); return txt; })
      .finally(() => timer && clearTimeout(timer));
  }

  /* Lectura directa (al instante). Si alguna celda de precio llega vacía
     por un formato distinto, se completa con la versión publicada. */
  function leerPlanilla() {
    const directa = PLANILLA_ID
      ? pedir("https://docs.google.com/spreadsheets/d/" + PLANILLA_ID + "/gviz/tq?tqx=out:csv&headers=1&gid=0", 8000)
      : Promise.reject(new Error("Sin ID"));
    const publicada = PLANILLA_CSV_URL ? pedir(PLANILLA_CSV_URL, 8000) : Promise.reject(new Error("Sin enlace"));
    return Promise.allSettled([directa, publicada]).then(([d, p]) => {
      if (d.status !== "fulfilled") {
        if (p.status === "fulfilled") return p.value;
        throw new Error("Planilla no disponible");
      }
      const filas = parseCSV(d.value);
      if (p.status !== "fulfilled" || filas.length < 2) return aCSV(filas);
      const pub = parseCSV(p.value);
      const hd = filas[0].map(norm), hp = (pub[0] || []).map(norm);
      const ic = hd.indexOf("categoria"), ip = hd.indexOf("plato"), ipr = hd.indexOf("precio");
      const jc = hp.indexOf("categoria"), jp = hp.indexOf("plato"), jpr = hp.indexOf("precio");
      if ([ic, ip, ipr, jc, jp, jpr].some(i => i < 0)) return aCSV(filas);
      const precios = new Map(pub.slice(1).map(r => [norm(r[jc]) + "|" + norm(r[jp]), (r[jpr] || "").trim()]));
      for (const r of filas.slice(1)) {
        if ((r[ip] || "").trim() && !(r[ipr] || "").trim()) {
          const v = precios.get(norm(r[ic]) + "|" + norm(r[ip]));
          if (v) r[ipr] = v;
        }
      }
      return aCSV(filas);
    });
  }

  function mostrar(txt) {
    const c = construir(txt);
    if (!c.length) throw new Error("Sin platos");
    categorias = c; render($q.value);
  }

  function usarRespaldo() {
    const local = leerLocal();
    try { if (local) { mostrar(local); return; } } catch (e) {}
    mostrar(respaldo());
  }

  if (!PLANILLA_ID && !PLANILLA_CSV_URL) {
    usarRespaldo();
  } else {
    $main.innerHTML = '<p class="empty">Cargando la carta…</p>';
    let listo = false;
    const plazo = setTimeout(() => { if (!listo) usarRespaldo(); }, 6000);
    leerPlanilla()
      .then(txt => { mostrar(txt); listo = true; guardarLocal(txt); })
      .catch(() => { if (!listo) usarRespaldo(); listo = true; })
      .finally(() => clearTimeout(plazo));
  }
})();
</script>
